[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bihash-former"
version = "0.1.0"
description = "BiHashFormer: Hash-Driven Dual-Branch Transformer for HRW Object Detection"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["bihash_former*"]
